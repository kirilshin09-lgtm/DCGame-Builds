<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0b0d12">
    <title>DCGame</title>
    <meta name="description" content="Прототип мобильной изометрической игры про колледж: задания, тесты и конспекты.">
    <!-- link previews in messengers; relative image resolves against the page URL -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="DCGame">
    <meta property="og:description" content="Прототип мобильной изометрической игры про колледж: задания, тесты и конспекты.">
    <meta property="og:image" content="preview.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="preview.png">
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0; height: 100%;
        background: #0b0d12;
        overflow: hidden; overscroll-behavior: none;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      /* The game is authored for a 1080x1920 phone. Keep that shape on desktop
         and let it fill the screen on a real phone. */
      #shell {
        position: fixed; inset: 0;
        display: flex; align-items: center; justify-content: center;
      }
      #frame {
        position: relative;
        height: 100vh; height: 100dvh;
        width: calc(100vh * 9 / 16); width: calc(100dvh * 9 / 16);
        max-width: 100vw;
        max-height: calc(100vw * 16 / 9);
        background: #0b0d12;
        overflow: hidden;
      }
      body.is-desktop #frame {
        height: min(100dvh - 32px, 960px);
        width: calc(min(100dvh - 32px, 960px) * 9 / 16);
        border-radius: 22px;
        box-shadow: 0 24px 70px rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.07);
      }
      #unity-canvas {
        display: block; width: 100%; height: 100%;
        background: #0b0d12;
        touch-action: none; outline: none;
      }
      /* loading */
      #loading {
        position: absolute; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px; background: #0b0d12; z-index: 5;
      }
      #loading h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: .04em; color: #eef0f5; }
      #bar { width: 62%; max-width: 280px; height: 6px; border-radius: 999px; background: rgba(255,255,255,.12); overflow: hidden; }
      #bar > div { height: 100%; width: 0%; border-radius: 999px; background: #4c73d9; transition: width .15s ease-out; }
      #hint { font-size: 13px; color: #8b90a0; margin: 0; }
      #loading.done { display: none; }
      /* fullscreen affordance, desktop only */
      #fs {
        position: absolute; right: 10px; bottom: 10px; z-index: 4;
        width: 34px; height: 34px; border: 0; border-radius: 9px; cursor: pointer;
        background: rgba(20,22,30,.72); color: #cfd3de; font-size: 15px; line-height: 1;
        opacity: 0; transition: opacity .2s;
      }
      body.is-desktop #frame:hover #fs { opacity: 1; }
      #banner {
        position: absolute; left: 0; right: 0; top: 0; z-index: 6;
        font-size: 12px; text-align: center;
      }
      #banner > div { padding: 7px 10px; }
    </style>
  </head>
  <body>
    <div id="shell">
      <div id="frame">
        <canvas id="unity-canvas" width="540" height="960" tabindex="-1"></canvas>
        <div id="banner"></div>
        <div id="loading">
          <h1>DCGame</h1>
          <div id="bar"><div></div></div>
          <p id="hint">Загрузка…</p>
        </div>
        <button id="fs" title="На весь экран">&#9974;</button>
      </div>
    </div>

    <script>
      var canvas = document.querySelector("#unity-canvas");
      var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      if (!isMobile) document.body.classList.add("is-desktop");

      function unityShowBanner(msg, type) {
        var host = document.querySelector("#banner");
        var div = document.createElement("div");
        div.innerHTML = msg;
        div.style.background = type == "error" ? "#c0392b" : (type == "warning" ? "#b8912a" : "#2a2f3d");
        div.style.color = "#fff";
        host.appendChild(div);
        if (type != "error") setTimeout(function () { host.removeChild(div); }, 5000);
      }

      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGLTest.data",
        frameworkUrl: buildUrl + "/WebGLTest.framework.js",
        codeUrl: buildUrl + "/WebGLTest.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "DCGame",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
      };

      // Render at native pixels up to 2x: DPR 1 on phones makes the browser
      // upscale 2-4x and everything turns blurry; full retina (3-4x) is too
      // heavy for phone GPUs. 2x is sharp on every screen at half the cost.
      config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);

      var script = document.createElement("script");
      script.src = buildUrl + "/WebGLTest.loader.js";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.querySelector("#bar > div").style.width = (100 * progress) + "%";
        }).then(function (unityInstance) {
          document.querySelector("#loading").classList.add("done");
          document.querySelector("#fs").onclick = function () { unityInstance.SetFullscreen(1); };
        }).catch(function (message) {
          document.querySelector("#hint").textContent = message;
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
